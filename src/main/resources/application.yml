server:
  port: 8080

spring:
  application:
    name: hiresmart-backend
  profiles:
    active: ${SPRING_PROFILE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  # Email Configuration (Brevo SMTP)
  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:a710f3001@smtp-brevo.com}
    password: ${SPRING_MAIL_PASSWORD:your-brevo-smtp-key}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Security & JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000

# Cloudflare R2 Object Storage
cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT:https://example-account-id.r2.cloudflarestorage.com}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket-name: ${R2_BUCKET_NAME:hiresmart-resumes}
    public-url: ${R2_PUBLIC_URL:https://pub-hiresmart.r2.dev}

# AI Integration
ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
  openai:
    api-key: ${OPENAI_API_KEY:}

---
# Development Profile: H2 in-memory
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:hiresmart_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

---
# Production Profile: MySQL on localhost
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hiresmart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
