# ===================================================================
# HireSmart AI — Core Application Properties
# ===================================================================

server.port=8080

# Spring Application
spring.application.name=hiresmart-backend

# Local MySQL Database Configuration (Workbench & Root)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hiresmart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Initial Data Load for MySQL (data.sql)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Email Configuration (Brevo SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:a710f3001@smtp-brevo.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-brevo-smtp-key}
spring.mail.from=${SPRING_MAIL_FROM:vamshiambatipudi@gmail.com}
spring.mail.from-name=${SPRING_MAIL_FROM_NAME:HireSmart AI}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000

# Cloudflare R2 Object Storage
cloudflare.r2.endpoint=${R2_ENDPOINT:https://example-account-id.r2.cloudflarestorage.com}
cloudflare.r2.access-key=${R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${R2_SECRET_KEY:}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:hiresmart-resumes}
cloudflare.r2.public-url=${R2_PUBLIC_URL:https://pub-hiresmart.r2.dev}

# AI Integration
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.openai.api-key=${OPENAI_API_KEY:}
